<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="55%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0E9F6E" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E9F6E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0E9F6E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2A38" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1E2A38" stop-opacity="0"/>
    </radialGradient>
    <style>
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      .h    { font-size: 21px; font-weight: 600; fill: #1C1917; }
      .sub  { font-size: 16px; fill: #57534E; }
      .lbl  { font-size: 11px; font-weight: 600; fill: #78716C; letter-spacing: 0.9px; }
      .num  { font-size: 22px; font-weight: 700; fill: #1C1917; }
      .cell { font-size: 15px; fill: #292524; }
      .cellb{ font-size: 15px; font-weight: 600; fill: #1C1917; }
      .acc  { font-size: 15px; font-weight: 600; fill: #047857; }
      .pill { font-size: 12px; font-weight: 600; fill: #047857; }
      .navi { font-size: 15px; fill: #FFFFFF; }
      .axis { font-size: 12px; fill: #78716C; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#wash)"/>
  <circle cx="1330" cy="180" r="420" fill="url(#glowA)"/>
  <circle cx="180" cy="880" r="460" fill="url(#glowB)"/>

  <!-- ===== Barra lateral ===== -->
  <g opacity="0.62">
    <rect x="0" y="0" width="250" height="1000" fill="#1E2A38"/>
    <text class="navi" x="28" y="46" style="font-size:16px;font-weight:700;">DTT Coaching</text>
    <text x="28" y="70" style="font-size:11px;font-weight:700;fill:#34D399;letter-spacing:1.4px;">PAYROLL</text>

    <rect x="16" y="128" width="218" height="42" rx="10" fill="#0E9F6E" opacity="0.34"/>
    <text class="navi" x="38" y="155" style="fill:#6EE7B7;font-weight:600;">Dashboard</text>
    <text class="navi" x="38" y="212" opacity="0.72">Run payroll</text>
    <text class="navi" x="38" y="260" opacity="0.72">Employees</text>
    <text class="navi" x="38" y="308" opacity="0.72">History</text>
    <text class="navi" x="38" y="356" opacity="0.72">Settings</text>
  </g>

  <!-- ===== Barra superior ===== -->
  <g opacity="0.60">
    <rect x="250" y="0" width="1350" height="66" fill="#FFFFFF"/>
    <rect x="250" y="65" width="1350" height="1.5" fill="#E7E5E4"/>
    <text class="cellb" x="292" y="40">DTT Coaching — Payroll</text>
    <text class="cell" x="1318" y="39" opacity="0.7">demo@example.com</text>
    <rect x="1484" y="18" width="76" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text class="pill" x="1503" y="38">OWNER</text>
  </g>

  <!-- ===== Tarjeta: periodo actual ===== -->
  <g opacity="0.62">
    <rect x="306" y="150" width="640" height="266" rx="18" fill="#FFFFFF"/>
    <rect x="306" y="150" width="640" height="266" rx="18" fill="none" stroke="#E7E5E4" stroke-width="2"/>
    <text class="h"   x="342" y="196">Current pay period</text>
    <text class="sub" x="342" y="228">P-20260612 · Jun 12, 2026 – Jun 25, 2026</text>

    <rect x="758" y="172" width="156" height="70" rx="12" fill="#ECFDF5"/>
    <rect x="758" y="172" width="156" height="70" rx="12" fill="none" stroke="#A7F3D0" stroke-width="2"/>
    <text class="lbl" x="836" y="198" text-anchor="middle" style="fill:#047857;">PAY DATE</text>
    <text x="836" y="226" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#065F46;">Jul 3, 2026</text>

    <rect x="342" y="264" width="180" height="88" rx="12" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5"/>
    <text class="lbl" x="364" y="294">SUPERVISOR DEADLINE</text>
    <text class="num" x="364" y="326" style="font-size:19px;">Jul 1, 2026</text>

    <rect x="540" y="264" width="180" height="88" rx="12" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5"/>
    <text class="lbl" x="562" y="294">AREAS APPROVED</text>
    <text class="num" x="562" y="328">4 of 4</text>

    <rect x="738" y="264" width="180" height="88" rx="12" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5"/>
    <text class="lbl" x="760" y="294">WORKERS</text>
    <text class="num" x="760" y="328">72</text>

    <text class="acc" x="342" y="390">Run payroll</text>
  </g>

  <!-- ===== Tarjeta: ultimo payroll ===== -->
  <g opacity="0.62">
    <rect x="982" y="150" width="386" height="266" rx="18" fill="#FFFFFF"/>
    <rect x="982" y="150" width="386" height="266" rx="18" fill="none" stroke="#E7E5E4" stroke-width="2"/>
    <text class="h"   x="1018" y="196">Last payroll</text>
    <text class="lbl" x="1018" y="230">PAY DATE</text>
    <text class="num" x="1018" y="262" style="font-size:24px;">Jun 19, 2026</text>

    <rect x="1018" y="296" width="314" height="1.5" fill="#E7E5E4"/>
    <text class="cell"  x="1018" y="330" opacity="0.8">Total</text>
    <text class="cellb" x="1332" y="330" text-anchor="end">$128,450.00</text>
    <text class="cell"  x="1018" y="370" opacity="0.8">Workers</text>
    <text class="cellb" x="1332" y="370" text-anchor="end">68</text>
  </g>

  <!-- ===== Tabla de areas ===== -->
  <g opacity="0.60">
    <rect x="306" y="452" width="640" height="404" rx="18" fill="#FFFFFF"/>
    <rect x="306" y="452" width="640" height="404" rx="18" fill="none" stroke="#E7E5E4" stroke-width="2"/>
    <text class="h" x="342" y="498">Areas this period</text>

    <rect x="306" y="530" width="640" height="42" fill="#FAFAF9"/>
    <text class="lbl" x="342" y="557">AREA</text>
    <text class="lbl" x="560" y="557">WORKERS</text>
    <text class="lbl" x="700" y="557">STATUS</text>
    <text class="lbl" x="912" y="557" text-anchor="end">TOTAL ($)</text>

    <text class="cellb" x="342" y="608">BA</text>
    <text class="cell"  x="560" y="608">38</text>
    <rect x="700" y="591" width="88" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text class="pill"  x="744" y="608" text-anchor="middle">Approved</text>
    <text class="cell"  x="912" y="608" text-anchor="end">54,120.00</text>
    <rect x="342" y="634" width="576" height="1.5" fill="#F5F5F4"/>

    <text class="cellb" x="342" y="672">CMHC</text>
    <text class="cell"  x="560" y="672">9</text>
    <rect x="700" y="655" width="88" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text class="pill"  x="744" y="672" text-anchor="middle">Approved</text>
    <text class="cell"  x="912" y="672" text-anchor="end">18,940.00</text>
    <rect x="342" y="698" width="576" height="1.5" fill="#F5F5F4"/>

    <text class="cellb" x="342" y="736">TCM</text>
    <text class="cell"  x="560" y="736">14</text>
    <rect x="700" y="719" width="88" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text class="pill"  x="744" y="736" text-anchor="middle">Approved</text>
    <text class="cell"  x="912" y="736" text-anchor="end">31,275.00</text>
    <rect x="342" y="762" width="576" height="1.5" fill="#F5F5F4"/>

    <text class="cellb" x="342" y="800">EMP / Office</text>
    <text class="cell"  x="560" y="800">11</text>
    <rect x="700" y="783" width="88" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text class="pill"  x="744" y="800" text-anchor="middle">Approved</text>
    <text class="cell"  x="912" y="800" text-anchor="end">24,115.00</text>
  </g>

  <!-- ===== Grafico de barras ===== -->
  <g opacity="0.60">
    <rect x="982" y="452" width="386" height="404" rx="18" fill="#FFFFFF"/>
    <rect x="982" y="452" width="386" height="404" rx="18" fill="none" stroke="#E7E5E4" stroke-width="2"/>
    <text class="h" x="1018" y="498">Gross by period</text>
    <text class="sub" x="1018" y="524" style="font-size:13px;">Last 6 periods</text>

    <rect x="1018" y="788" width="314" height="1.5" fill="#E7E5E4"/>
    <rect x="1030" y="700" width="38" height="88"  rx="6" fill="url(#bar)"/>
    <rect x="1084" y="648" width="38" height="140" rx="6" fill="url(#bar)"/>
    <rect x="1138" y="592" width="38" height="196" rx="6" fill="url(#bar)"/>
    <rect x="1192" y="672" width="38" height="116" rx="6" fill="url(#bar)"/>
    <rect x="1246" y="556" width="38" height="232" rx="6" fill="url(#bar)"/>
    <rect x="1300" y="620" width="38" height="168" rx="6" fill="url(#bar)"/>

    <text class="axis" x="1049" y="812" text-anchor="middle">P-01</text>
    <text class="axis" x="1103" y="812" text-anchor="middle">P-02</text>
    <text class="axis" x="1157" y="812" text-anchor="middle">P-03</text>
    <text class="axis" x="1211" y="812" text-anchor="middle">P-04</text>
    <text class="axis" x="1265" y="812" text-anchor="middle">P-05</text>
    <text class="axis" x="1319" y="812" text-anchor="middle">P-06</text>

    <text class="axis" x="1049" y="690" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">98k</text>
    <text class="axis" x="1103" y="638" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">112k</text>
    <text class="axis" x="1157" y="582" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">126k</text>
    <text class="axis" x="1211" y="662" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">104k</text>
    <text class="axis" x="1265" y="546" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">134k</text>
    <text class="axis" x="1319" y="610" text-anchor="middle" style="font-size:11px;fill:#047857;font-weight:600;">118k</text>
  </g>
</svg>
